# ============================================================
# FarmBridge — Frontend nginx configuration (production / Docker)
# ADF Phase 12 · Steps 2–3
#
# Mirrors the Vite development proxy (vite.config.js):
#   - /api       → backend  (Spring Boot REST API)
#   - /uploads   → backend  (product images served by Spring static handler)
#
# The browser only ever talks to this server (same origin), so the app's
# relative axios baseURL ('/api') works unchanged and no CORS is required.
#
# This file is an envsubst TEMPLATE (see Dockerfile): at container start
# the official nginx entrypoint substitutes the environment variable
# $BACKEND_UPSTREAM into every proxy_pass, producing a static config:
#   - standalone `docker run`  → BACKEND_UPSTREAM=host.docker.internal:8080
#   - docker compose           → BACKEND_UPSTREAM=backend:8080 (service DNS)
# All other $variables below ($uri, $host, ...) are nginx variables and are
# NOT substituted (they are not environment variables).
# ============================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip static text assets ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Hashed build assets — immutable, cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- REST API → backend (upstream substituted at container start) ----
    location /api/ {
        proxy_pass http://$BACKEND_UPSTREAM;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous upstream timeouts: the announcement endpoint fans out
        # emails synchronously and can legitimately take >60s. The Vite dev
        # proxy has no read cap; raise nginx's 60s default so the Docker
        # frontend behaves identically instead of returning a 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ---- Product images → backend static resource handler ----
    location /uploads/ {
        proxy_pass http://$BACKEND_UPSTREAM;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- React SPA (BrowserRouter) fallback ----
    # Direct navigation to /login, /register, /buyer/products, /admin/...
    # must return index.html (the router renders the correct page), never 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
