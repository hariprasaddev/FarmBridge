# ============================================
# Test configuration
# NOTE: this file shadows the main application.properties on the test
# classpath, so it must repeat the datasource/JPA/JWT settings too.
# ============================================

# Database Configuration
# Read from env vars with local-development defaults (mirrors the main config)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmbridge}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Hari@1849}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# JWT signing key — read from env var with a local-development default
jwt.secret=${JWT_SECRET:FarmTrustSuperSecretKeyForJwtAuthentication2026Secure}

# File Upload Configuration
file.upload-dir=uploads/products

# Multipart limits (Spring Boot 4.x namespace)
spring.http.multipart.max-file-size=5MB
spring.http.multipart.max-request-size=6MB

# Mail: point at a local, always-closed port so any email send triggered
# by a service hook (orders, verification, welcome) fails fast and is
# swallowed by EmailService — the tests verify business logic, not SMTP.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=500
spring.mail.properties.mail.smtp.timeout=500
spring.mail.properties.mail.smtp.writetimeout=500

# App base URL used in email deep links
app.base-url=http://localhost:5173
app.support-email=support@farmbridge.com
app.reset-password-url=http://localhost:5173/reset-password
