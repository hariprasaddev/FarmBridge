spring.application.name=FarmBridge

# Database Configuration
# Credentials are read from environment variables (DB_URL / DB_USERNAME /
# DB_PASSWORD) with local-development defaults — Docker/Compose overrides them.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmbridge}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Hari@1849}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# JWT signing key — read from env var with a local-development default
jwt.secret=${JWT_SECRET:FarmTrustSuperSecretKeyForJwtAuthentication2026Secure}

# File Upload Configuration
# Directory where product images are stored (relative to the app working dir)
file.upload-dir=uploads/products

# Cloudinary (optional) — persistent production image storage.
# When CLOUDINARY_CLOUD_NAME is set, FileStorageService uploads images to
# Cloudinary and returns their secure HTTPS CDN URLs (survive Render
# restarts/redeploys). Empty defaults keep local dev/tests on the local
# filesystem — credentials are injected only via environment variables.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart limits (Spring Boot 4.x namespace - spring.servlet.* was removed)
spring.http.multipart.max-file-size=5MB
spring.http.multipart.max-request-size=6MB

# ============================================
# Mail Configuration (Password Reset)
# Credentials are read from environment variables
# (MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD)
# and are never hardcoded.
# ============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# Short timeouts so a missing/broken SMTP server fails fast (and is logged)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend password-reset page URL used in the reset email body
app.reset-password-url=${APP_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

# ============================================
# Email notification system
# Base URL used to build deep links inside emails
# (must be the deployed frontend URL in production)
# ============================================
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.support-email=${APP_SUPPORT_EMAIL:support@farmbridge.com}